name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/test

  postman-smoke-test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build boot jar
        run: ./gradlew bootJar --no-daemon -x test

      - name: Start app in background
        # APP_API_KEY debe coincidir con la variable "apiKey" del
        # environment de Postman usado abajo (pet-challenge.local.postman_environment.json),
        # si no todas las requests bajo /api/** fallarían con 401.
        env:
          APP_API_KEY: change-me-in-prod
        run: nohup java -jar build/libs/*.jar > app.log 2>&1 &

      - name: Wait for app to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/actuator/health; then
              echo "App is up"
              exit 0
            fi
            sleep 2
          done
          echo "App failed to start"
          cat app.log
          exit 1

      # Pega contra la sandbox pública real de Petstore (no un mock) — es
      # justamente lo que un smoke test debe probar: que la integración
      # end-to-end funciona, no solo la app aislada.
      - name: Run Postman collection with Newman
        run: >
          npx --yes newman run postman/pet-challenge.postman_collection.json
          -e postman/pet-challenge.local.postman_environment.json

      - name: Print app logs on failure
        if: failure()
        run: cat app.log

  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.15.7'

      - name: terraform fmt
        run: terraform fmt -check -diff

      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate
