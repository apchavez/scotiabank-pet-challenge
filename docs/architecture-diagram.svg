<svg viewBox="0 0 1180 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="420" fill="#f8fafc" />

  <text x="20" y="34" font-size="20" font-weight="700" fill="#0f172a">pet-challenge — Scotiabank Technical Interview</text>
  <text x="20" y="56" font-size="13" fill="#64748b">Spring Boot, cliente resiliente hacia Petstore público, Redis cache, Prometheus/Grafana</text>

  <g>
    <rect x="30" y="120" width="170" height="60" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5" />
    <text x="115" y="145" text-anchor="middle" font-size="13" font-weight="600" fill="#312e81">Cliente</text>
    <text x="115" y="163" text-anchor="middle" font-size="10" fill="#4338ca">header X-Api-Key</text>
  </g>

  <g>
    <rect x="250" y="120" width="180" height="60" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
    <text x="340" y="145" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1e3a8a">ApiKeyAuthFilter</text>
    <text x="340" y="163" text-anchor="middle" font-size="9.5" fill="#1e40af">stateless</text>
  </g>

  <g>
    <rect x="480" y="120" width="180" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
    <text x="570" y="145" text-anchor="middle" font-size="12.5" font-weight="700" fill="#14532d">PetController</text>
    <text x="570" y="163" text-anchor="middle" font-size="9.5" fill="#166534">GET/POST /api/pet</text>
  </g>

  <g>
    <rect x="710" y="120" width="160" height="60" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5" />
    <text x="790" y="145" text-anchor="middle" font-size="12" font-weight="700" fill="#14532d">PetService</text>
    <text x="790" y="163" text-anchor="middle" font-size="9.5" fill="#166534">cache-first en GET</text>
  </g>

  <g>
    <rect x="910" y="60" width="180" height="55" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5" />
    <text x="1000" y="83" text-anchor="middle" font-size="12" font-weight="700" fill="#7f1d1d">Redis</text>
    <text x="1000" y="99" text-anchor="middle" font-size="9.5" fill="#991b1b">TTL 30s</text>
  </g>

  <g>
    <rect x="910" y="140" width="180" height="55" rx="10" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.5" />
    <text x="1000" y="160" text-anchor="middle" font-size="11.5" font-weight="700" fill="#312e81">PetStoreClient</text>
    <text x="1000" y="176" text-anchor="middle" font-size="9" fill="#3730a3">Retry+CB+RateLimit</text>
  </g>

  <g>
    <rect x="910" y="220" width="180" height="55" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" />
    <text x="1000" y="242" text-anchor="middle" font-size="11.5" font-weight="700" fill="#334155">Petstore público</text>
    <text x="1000" y="258" text-anchor="middle" font-size="9" fill="#475569">petstore.swagger.io</text>
  </g>

  <g>
    <rect x="480" y="240" width="200" height="60" rx="10" fill="#fae8ff" stroke="#a21caf" stroke-width="1.5" />
    <text x="580" y="262" text-anchor="middle" font-size="11.5" font-weight="700" fill="#701a75">/actuator/prometheus</text>
    <text x="580" y="280" text-anchor="middle" font-size="9.5" fill="#86198f">métricas Micrometer</text>
  </g>

  <g>
    <rect x="250" y="240" width="180" height="60" rx="10" fill="#fae8ff" stroke="#a21caf" stroke-width="1.5" />
    <text x="340" y="265" text-anchor="middle" font-size="12" font-weight="700" fill="#701a75">Prometheus</text>
    <text x="340" y="283" text-anchor="middle" font-size="9.5" fill="#86198f">scrape</text>
  </g>

  <g>
    <rect x="30" y="240" width="170" height="60" rx="10" fill="#f3e8ff" stroke="#a21caf" stroke-width="1.5" />
    <text x="115" y="265" text-anchor="middle" font-size="12" font-weight="700" fill="#701a75">Grafana</text>
    <text x="115" y="283" text-anchor="middle" font-size="9.5" fill="#86198f">dashboards</text>
  </g>

  <g>
    <rect x="30" y="330" width="1120" height="70" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="50" y="356" font-size="12" font-weight="700" fill="#0f172a">Notas de diseño</text>
    <text x="50" y="378" font-size="10.5" fill="#334155">PetStoreClient envuelve el sandbox público con Retry + CircuitBreaker + RateLimiter (Resilience4j) porque ese servicio de terceros es compartido/mutable y no controlado — ver README "Resiliencia".</text>
  </g>

  <line x1="200" y1="150" x2="248" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="430" y1="150" x2="478" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="660" y1="150" x2="708" y2="150" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="870" y1="140" x2="908" y2="105" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow)" />
  <text x="875" y="130" font-size="9" fill="#991b1b">GET: cache hit</text>
  <line x1="870" y1="160" x2="908" y2="167" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="1000" y1="195" x2="1000" y2="218" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="570" y1="180" x2="580" y2="238" stroke="#a21caf" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="480" y1="270" x2="432" y2="270" stroke="#a21caf" stroke-width="1.8" marker-end="url(#arrow)" />
  <line x1="250" y1="270" x2="202" y2="270" stroke="#a21caf" stroke-width="1.8" marker-end="url(#arrow)" />

  <text x="20" y="415" font-size="10.5" fill="#94a3b8">Reto técnico entregado — ver README para el diagrama Mermaid equivalente y el detalle del ID mágico 999999999 en la colección Postman.</text>
</svg>
