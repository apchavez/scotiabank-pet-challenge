spring.application.name=pet-challenge

petstore.base-url=https://petstore.swagger.io/v2
petstore.connect-timeout-ms=3000
petstore.read-timeout-ms=5000

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=when-authorized
management.prometheus.metrics.export.enabled=true
# El cache es una optimización no crítica (TTL corto, con fallback
# implícito: si Redis no responde, @Cacheable simplemente no cachea y la
# app sigue funcionando contra Petstore). No queremos que un problema de
# Redis tumbe el health check de toda la app.
management.health.redis.enabled=false

# Redis: cache de GET /api/pet/{idPet} (TTL corto, ver CacheConfig). Los
# defaults localhost/6379 son sobreescribibles por env vars que Spring Boot
# mapea automáticamente (relaxed binding): SPRING_DATA_REDIS_HOST/PORT.
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Autenticación por API key (ver ApiKeyAuthFilter) para todas las rutas
# bajo /api/**. Sobreescribible por env var APP_API_KEY.
app.api-key=${APP_API_KEY:change-me-in-prod}

# Rate limiting a nivel de controller (ver PetController).
resilience4j.ratelimiter.instances.petApi.limit-for-period=20
resilience4j.ratelimiter.instances.petApi.limit-refresh-period=1s
resilience4j.ratelimiter.instances.petApi.timeout-duration=0

# Reintenta solo fallas de red/timeout hacia Petstore; los 4xx (p.ej. petId
# inexistente) no se reintentan porque no son errores transitorios.
resilience4j.retry.instances.petstore.max-attempts=3
resilience4j.retry.instances.petstore.wait-duration=200ms
resilience4j.retry.instances.petstore.retry-exceptions=org.springframework.web.client.ResourceAccessException
resilience4j.retry.instances.petstore.ignore-exceptions=org.springframework.web.client.HttpClientErrorException

# El circuit breaker tampoco cuenta los 4xx como falla (son errores de
# entrada del usuario, no indican que Petstore esté caído).
resilience4j.circuitbreaker.instances.petstore.sliding-window-size=10
resilience4j.circuitbreaker.instances.petstore.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.petstore.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.petstore.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.petstore.ignore-exceptions=org.springframework.web.client.HttpClientErrorException
